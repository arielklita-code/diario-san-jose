services:
  - type: web
    name: scout-san-jose
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn scout.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: scout-db
          property: connectionString

  - type: postgres
    name: scout-db
    plan: free
    ipAllowList: []
